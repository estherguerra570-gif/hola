<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hola</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  :root { --bg: #f3f5f8; --fg: #1d2433; --font-display: "Fraunces", Georgia, serif; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141821; --fg: #e9edf5; color-scheme: dark } }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    display: grid; place-items: center;
    padding: 0 16px;
  }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(3rem, 15vw, 9rem); margin: 0; }
</style>
</head>
<body>
<h1>Hola</h1>
</body>
</html>
